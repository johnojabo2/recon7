global:
  environment: production
  domain: recon7.yourdomain.com

api:
  replicaCount: 2
  image:
    repository: recon7/api
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

worker:
  replicaCount: 3
  image:
    repository: recon7/worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

frontend:
  replicaCount: 2
  image:
    repository: recon7/frontend
    tag: latest
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  enabled: true
  auth:
    database: recon7
    username: postgres
    password: reconpassword123
  primary:
    persistence:
      enabled: true
      size: 20Gi

config:
  litellmModel: "claude-sonnet-4-5-20250929"
  searchCacheTtlDays: 7
  allowAllScopesDev: false

secrets:
  jwtSecret: "change-me-to-a-strong-random-32-byte-hex-string"
  anthropicApiKey: ""
  openaiApiKey: ""
  serpapiApiKey: ""
  githubToken: ""
  censysApiId: ""
  censysApiSecret: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: recon7.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: recon7-tls-cert
      hosts:
        - recon7.yourdomain.com
